apply plugin: 'com.android.application'

// Version name comes from package.json; the version code (which must increase
// with every Play Store upload) from LISAN_VERSION_CODE, set by CI.
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersionName = packageJson.version
def appVersionCode = (System.getenv("LISAN_VERSION_CODE") ?: "1").toInteger()
// Path to the private Google Play upload key (see STORE.md); unset for test builds.
def uploadKeystore = System.getenv("LISAN_KEYSTORE_PATH")

android {
    namespace = "com.ammarmahdi.lisan"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ammarmahdi.lisan"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two signing keys:
    //  - "sideload": a non-secret key committed to the repo, used for test
    //    builds you install directly. Every build has the same signature, so a
    //    new APK installs over the old one and keeps your progress.
    //  - "upload": your private Google Play upload key, read from environment
    //    variables (GitHub secrets) so it never lives in the repo. See STORE.md.
    //    Play bundles (bundleRelease) refuse to build without it: see below.
    signingConfigs {
        sideload {
            storeFile file('sideload.keystore')
            storePassword 'lisan-sideload'
            keyAlias 'lisan-sideload'
            keyPassword 'lisan-sideload'
        }
        upload {
            if (uploadKeystore) {
                storeFile file(uploadKeystore)
                storePassword System.getenv("LISAN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LISAN_KEY_ALIAS")
                keyPassword System.getenv("LISAN_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            // Installable APKs (assembleRelease) fall back to the sideload key.
            signingConfig uploadKeystore ? signingConfigs.upload : signingConfigs.sideload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// A Play Store bundle must never be signed with the public sideload key:
// whoever uploads first sets the app's upload key, and that key is in this
// repo for anyone to use. So when a release bundle is requested without
// LISAN_KEYSTORE_PATH, stop before anything is built instead of falling back.
// Installable APKs (assembleRelease) are not affected, and neither is Android
// Studio's "Generate Signed App Bundle", which passes the key you pick as
// android.injected.signing.* properties that replace the signing config.
def ideSigning = project.hasProperty('android.injected.signing.store.file')
gradle.taskGraph.whenReady { graph ->
    def bundleTasks = ['bundleRelease', 'signReleaseBundle'].collect { "${project.path}:${it}" }
    if (!uploadKeystore && !ideSigning && bundleTasks.any { graph.hasTask(it) }) {
        throw new GradleException(
            "A Play Store bundle needs your private upload key, but LISAN_KEYSTORE_PATH is not set. " +
            "Set LISAN_KEYSTORE_PATH, LISAN_KEYSTORE_PASSWORD, LISAN_KEY_ALIAS and LISAN_KEY_PASSWORD (see STORE.md → Upload key), " +
            "or run assembleRelease for an installable test APK signed with the sideload key.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
