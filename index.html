<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Four Tongues</title>
  <meta name="description" content="Learn vocabulary and pronunciation in Turkish, Ukrainian, Japanese and Arabic with spaced repetition, native-voice audio, syllable and stress breakdowns, and speech-recognition feedback.">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#c8102e">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Four Tongues">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/read.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/session.css">
  <!-- The dark theme. It follows the device unless Settings → Display → Theme
       says otherwise: the script below (and js/themes.js) then sets this
       media to "all" or "not all". Keep it after the other stylesheets. -->
  <link rel="stylesheet" href="css/dark.css" id="dark-css" media="(prefers-color-scheme: dark)">
  <!-- Loading screen: painted as soon as the page arrives, before the app's
       modules. Its colours are the light/dark tokens of css/styles.css and
       css/dark.css (tests/perf.test.js keeps them in step); they are inline
       so the screen, and its error message, also work if a stylesheet fails.
       A chosen background (--bg, --surface, --border on <html>) shows through. -->
  <style>
    .boot {
      --boot-bg: #faf7f2; --boot-surface: #ffffff; --boot-text: #1f1b16; --boot-muted: #6c645a;
      --boot-border: #e7e0d5; --boot-accent: #c8102e; --boot-accent-ink: #ffffff;
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
      padding: 24px 16px; text-align: center;
      background: var(--bg, var(--boot-bg)); color: var(--boot-text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .boot-brand { display: flex; align-items: center; gap: .6rem; margin: 0; font: 700 1.6rem/1.2 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .boot-spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid var(--boot-border); border-top-color: var(--boot-accent);
      animation: boot-spin .9s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) { .boot-spinner { animation-duration: 3s; } }
    .boot-text { margin: 0; max-width: 24rem; color: var(--boot-muted); }
    .boot-text b { display: block; color: var(--boot-text); font-size: 1.1rem; }
    .boot-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
    .boot-actions[hidden], .boot [hidden] { display: none; }
    .boot-btn {
      min-height: 44px; padding: .55rem 1.1rem; border-radius: 12px; cursor: pointer;
      font: inherit; font-weight: 600;
      border: 1px solid var(--border, var(--boot-border)); background: var(--surface, var(--boot-surface)); color: var(--boot-text);
    }
    .boot-btn.primary { background: var(--boot-accent); border-color: var(--boot-accent); color: var(--boot-accent-ink); }
    .boot-btn:focus-visible { outline: 3px solid var(--boot-accent); outline-offset: 2px; }
    .boot.failed .boot-spinner { display: none; }
    /* The start screen ("intro"), every cold start: the icon's tea glass on its
       terracotta, centred at 288 px like Android 12's system splash (same
       colour, same place), so the two read as one; then the name rises in and
       js/boot.js hands over to the app. A tap skips it. Under "reduce motion"
       or Animations off it stands still (css/styles.css turns animations off).
       If starting fails, the class becomes "boot failed" and the normal
       colours return for the message. */
    .boot.intro { background: #7A2F1F; color: #FBEFDC; --boot-text: #FBEFDC; --boot-muted: rgba(251, 239, 220, .82); --boot-border: rgba(251, 239, 220, .3); --boot-accent: #FBEFDC; cursor: pointer; }
    .boot-mark { display: none; }
    .boot.intro .boot-mark { display: block; position: absolute; top: 50%; left: 50%; width: 288px; height: 288px; margin: -144px 0 0 -144px; }
    .boot.intro .boot-brand { position: absolute; top: calc(50% + 116px); left: 0; right: 0; justify-content: center; font-size: 1.9rem; animation: boot-rise .45s cubic-bezier(.2, .8, .2, 1) .12s backwards; }
    .boot.intro .boot-icon { display: none; }
    .boot.intro .boot-spinner, .boot.intro .boot-text { position: absolute; top: calc(50% + 176px); opacity: 0; animation: boot-later .3s ease 1.6s forwards; }
    .boot.intro .boot-text { top: calc(50% + 214px); left: 16px; right: 16px; margin: 0 auto; }
    .boot.intro .boot-spinner { animation: boot-spin .9s linear infinite, boot-later .3s ease 1.6s forwards; }
    @keyframes boot-rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes boot-later { to { opacity: 1; } }
  </style>
  <style id="boot-dark" media="(prefers-color-scheme: dark)">
    .boot {
      --boot-bg: #121110; --boot-surface: #27231e; --boot-text: #f3eee6; --boot-muted: #a89f93;
      --boot-border: #443d35; --boot-accent: #ff4d63; --boot-accent-ink: #1b0207;
    }
  </style>
  <!-- Before the first paint: the chosen theme. And start fetching the pack
       of the language being learned right away, instead of after app.js has
       loaded (it is the biggest download). -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('lisan:v1') || '{}').settings || {};
      // The chosen theme, before anything is painted (js/themes.js does the same once the app runs).
      var m = s.theme === 'dark' ? 'all' : s.theme === 'light' ? 'not all' : '';
      if (m) { document.getElementById('dark-css').media = m; document.getElementById('boot-dark').media = m; }
      var d = m ? m === 'all' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      var v = (JSON.parse(localStorage.getItem('lisan:theme') || '{}') || {})[d ? 'dark' : 'light'] || {};
      for (var n in v) if (/^--[a-z0-9-]+$/.test(n) && /^#[0-9a-f]{6}$/.test(v[n])) document.documentElement.style.setProperty(n, v[n]);
      // Corners and headings too (js/ui.js applyLooks does the same once the app runs).
      var r = document.documentElement;
      if (s.corners === 'square') r.dataset.corners = 'square';
      if (s.headings === 'serif') r.dataset.headings = 'serif';
      if (s.motion === 'off') r.dataset.motion = 'off';
      var l = s.lang;
      if (!/^(tr|uk|ja|ar)$/.test(l)) l = 'tr';
      ['index', 'vocab', 'more', 'grammar', 'examples', 'sounds'].forEach(function (f) {
        var k = document.createElement('link');
        k.rel = 'modulepreload';
        k.href = 'js/languages/' + l + '/' + f + '.js';
        document.head.appendChild(k);
      });
    } catch (e) { /* storage blocked: the app loads the pack itself */ }
  </script>
  <!-- modulepreload:app (filled in by scripts/build-web.js) -->
  <script type="module" src="js/app.js"></script>
  <noscript><style>#boot { display: none; }</style></noscript>
</head>
<body>
  <div id="boot" class="boot intro" role="status" aria-live="polite">
    <img class="boot-mark" src="icons/splash-mark.svg" alt="" width="288" height="288">
    <p class="boot-brand"><img class="boot-icon" src="icons/icon.svg" alt="" width="40" height="40">Four Tongues</p>
    <div class="boot-spinner" aria-hidden="true"></div>
    <p class="boot-text" id="boot-text">Loading…</p>
    <div class="boot-actions" id="boot-actions" hidden>
      <button type="button" class="boot-btn primary" id="boot-retry">Try again</button>
      <button type="button" class="boot-btn" id="boot-repair" hidden>Repair offline files</button>
    </div>
  </div>
  <script>
    // In the Android and iOS apps the system splash shows the same picture as
    // the start screen above: take it away as soon as the page has painted it,
    // so the hand-over can't be seen (capacitor.config.json lets it go by
    // itself after 3 seconds if this never runs).
    (function () {
      try {
        var C = window.Capacitor;
        if (!C || !C.isNativePlatform || !C.isNativePlatform() || !(C.PluginHeaders || []).some(function (p) { return p.name === 'SplashScreen'; })) return;
        requestAnimationFrame(function () { requestAnimationFrame(function () { C.nativePromise('SplashScreen', 'hide', { fadeOutDuration: 0 }); }); });
      } catch (e) { /* the splash goes by itself */ }
    })();
  </script>
  <script>
    // Start-up watchdog. A classic script, so it runs even when the app's
    // modules can't: if a file fails to load, or starting throws, the loading
    // screen shows what happened and a way out instead of staying blank.
    // js/boot.js sets window.__lisanBooted and removes the screen once the
    // first view is on.
    (function () {
      var failed = false;
      var $ = function (id) { return document.getElementById(id); };
      var sw = navigator.serviceWorker;

      function show(title, text, slow) {
        if (window.__lisanBooted || !$('boot')) return;
        if (!slow) $('boot').className = 'boot failed';
        $('boot-text').innerHTML = '';
        var b = document.createElement('b');
        b.textContent = title;
        $('boot-text').appendChild(b);
        $('boot-text').appendChild(document.createTextNode(text));
        $('boot-actions').hidden = false;
        // Offline files that are broken or outdated can be fetched afresh.
        $('boot-repair').hidden = !(sw && sw.controller);
        if (!slow) $('boot-retry').focus();
      }

      function fail(err) {
        if (failed || window.__lisanBooted) return;
        failed = true;
        console.error('Four Tongues could not start:', err);
        var load = err && err.lisanLoad;
        show('Four Tongues couldn’t start',
          navigator.onLine === false ? 'You’re offline, and part of the app isn’t saved on this device yet. Connect to the internet and try again.'
            : load ? 'Part of the app didn’t load. Check your connection and try again.'
            : 'Something went wrong while starting. Try again — your progress on this device is safe.');
      }
      // An error thrown while starting may also come from something that
      // doesn't stop the app: give it a moment to start anyway.
      function failSoon(err) {
        setTimeout(function () { fail(err); }, 1000);
      }

      $('boot-retry').onclick = function () { location.reload(); };
      $('boot-repair').onclick = function () {
        this.disabled = true;
        var jobs = [];
        if (sw && sw.getRegistrations) {
          jobs.push(sw.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) { return k.indexOf('lisan-') === 0; }).map(function (k) { return caches.delete(k); }));
          }));
        }
        var reload = function () { location.reload(); };
        Promise.all(jobs).then(reload, reload);
      };

      // A script (an app module) that can't be fetched fires 'error' on its
      // element, seen here in the capture phase; one that throws while
      // starting reports to window.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT') {
          var err = new Error('Could not load ' + (t.src || 'a script'));
          err.lisanLoad = true;
          fail(err);
        } else if (t === window || !t || !t.tagName) {
          failSoon(e.error || e.message);
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) { failSoon(e.reason); });

      if (!('noModule' in document.createElement('script'))) {
        failed = true;
        show('This browser can’t run Four Tongues', 'Please update it, or open Four Tongues in a current version of Chrome, Edge, Firefox or Safari.');
        $('boot-actions').hidden = true;
        return;
      }
      setTimeout(function () {
        if (!failed) show('Still loading…', 'This is taking longer than usual. Check your connection, or try again.', true);
      }, 15000);
      // js/boot.js removes the screen as soon as the first view is on. Also
      // remove it once any first view is on: right after a deploy the browser
      // may run scripts from its cache that are older than this page and
      // don't know about the screen.
      var poll = setInterval(function () {
        if (window.__lisanBooted) { clearInterval(poll); return; }
        if (!document.querySelector('#view > *')) return;
        clearInterval(poll);
        window.__lisanBooted = true;
        var el = $('boot');
        if (el) el.parentNode.removeChild(el);
      }, 250);
    })();
  </script>
  <noscript><p style="padding:2rem">Four Tongues needs JavaScript to run.</p></noscript>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
