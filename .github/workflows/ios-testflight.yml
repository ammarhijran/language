name: iOS → TestFlight

# Manually triggered (Actions tab → "iOS → TestFlight" → Run workflow).
# Builds a signed release and uploads it to App Store Connect, from where you
# can test it with TestFlight and submit it for App Store review.
#
# Needs these repository secrets (see STORE.md → "iOS: automatic uploads"):
#   APPLE_TEAM_ID                 10-character Team ID (developer.apple.com → Membership)
#   APP_STORE_CONNECT_KEY_ID      API key ID (App Store Connect → Users and Access → Integrations)
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID shown on the same page
#   APP_STORE_CONNECT_KEY_P8      Contents of the downloaded AuthKey_XXXX.p8 file
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # Must increase with every upload.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::error::Add the APPLE_TEAM_ID and APP_STORE_CONNECT_* secrets first (see STORE.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync ios

      - name: Install App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      # The version shown in the App Store (MARKETING_VERSION) comes from
      # package.json, like on Android; the Xcode project's 1.0.0 is only a
      # fallback for local builds. The build number is the run number.
      - name: Archive
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Archiving version $VERSION ($BUILD_NUMBER)"
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lisan.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          # Stop here, before uploading, if the archive didn't pick the version up.
          ARCHIVED=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/Lisan.xcarchive/Info.plist")
          if [ "$ARCHIVED" != "$VERSION" ]; then
            echo "::error::The archive has version $ARCHIVED, expected $VERSION from package.json."
            exit 1
          fi

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lisan.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
