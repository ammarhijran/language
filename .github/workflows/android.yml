name: Android app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish the test APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Must increase with every Play Store upload.
      LISAN_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle's downloads are cached between builds: faster, and the build no
      # longer fetches every dependency from Maven Central each time (which
      # answered "429 Too Many Requests" on a busy day).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            package-lock.json

      - run: npm ci
      - run: npm test
      - name: Copy web app into the Android project
        run: npm run build && npx cap sync android

      # Installable APK signed with the repo's non-secret "sideload" key, so
      # each new build installs over the previous one on your phone.
      - name: Build installable APK
        working-directory: android
        # One retry: a download that failed (a busy mirror) usually works a minute later.
        run: ./gradlew assembleRelease --no-daemon || (echo "::warning::Gradle failed; retrying once in 60 s" && sleep 60 && ./gradlew assembleRelease --no-daemon)

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="Lisan-${VERSION}-build${LISAN_VERSION_CODE}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lisan-android-apk
          path: ${{ steps.apk.outputs.name }}

      # Keep one always-current "Android test build" release with the APK
      # attached, so it can be downloaded straight from a phone.
      - name: Publish test build release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          gh release delete android-test-build --cleanup-tag --yes 2>/dev/null || true
          gh release create android-test-build "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Lisan for Android — test build ${VERSION} (${LISAN_VERSION_CODE})" \
            --notes "Install on Android: download **${APK}** below on your phone and open it. You may need to allow installs from your browser or file manager.

          Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. New test builds install over this one and keep your progress."
          # Now and then GitHub leaves the new release as a draft (the APK link
          # then answers 404). Check, and publish it if that happened.
          for attempt in 1 2 3 4 5; do
            sleep 3
            draft=$(gh release view android-test-build --json isDraft --jq .isDraft 2>/dev/null || echo unknown)
            if [ "$draft" = "false" ]; then break; fi
            echo "Release is not published yet (isDraft=$draft), attempt $attempt: publishing it."
            gh release edit android-test-build --draft=false --prerelease || true
          done
          [ "$(gh release view android-test-build --json isDraft --jq .isDraft)" = "false" ]

      # Every Play bundle from main is uploaded to Play (the owner's rule since
      # 26 November 2026), so a bundle is built only when the push changes the
      # app itself: what scripts/build-web.js copies, the Android project, and
      # the packages. Docs, tests, store art and release notes alone build only
      # the test APK. A manual run, a pull request or a first push always counts.
      - name: Does this push change the app?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          APP='^(index\.html|privacy\.html|manifest\.webmanifest|sw\.js|capacitor\.config\.json|package(-lock)?\.json|scripts/build-web\.js|(css|js|icons|android)/)'
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename'); then
            echo "::warning::Could not list the changed files; building the Play bundle to be safe."
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          if echo "$files" | grep -qE "$APP"; then echo "app=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::No app files changed: no Play bundle for this push."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      # Google Play bundle, signed with your private upload key — only when the
      # signing secrets are configured (see STORE.md).
      - name: Build Play Store bundle
        if: env.HAS_UPLOAD_KEY == 'true' && steps.changed.outputs.app == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LISAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LISAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LISAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          LISAN_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" ./gradlew bundleRelease --no-daemon

      # The bundle travels with its release notes (play/release-notes.txt, in
      # Play's <en-US> tags) and a build.txt naming its version and commit, so
      # the uploader needs nothing else.
      - name: Release notes and build info next to the bundle
        if: env.HAS_UPLOAD_KEY == 'true' && steps.changed.outputs.app == 'true'
        run: |
          OUT=android/app/build/outputs/bundle/release
          cp play/release-notes.txt "$OUT/release-notes.txt"
          printf 'versionCode=%s\nversionName=%s\ncommit=%s\nbranch=%s\n' "$LISAN_VERSION_CODE" "$(node -p "require('./package.json').version")" "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$OUT/build.txt"
          cat "$OUT/build.txt" "$OUT/release-notes.txt"

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true' && steps.changed.outputs.app == 'true'
        with:
          name: lisan-play-store-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/release-notes.txt
            android/app/build/outputs/bundle/release/build.txt
